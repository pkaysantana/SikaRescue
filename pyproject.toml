[project]
name = "sikarescue"
version = "0.1.0"
description = "Agentic failed-payment recovery for cross-rail payments (hackathon demo; all rails and money are synthetic)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "logfire>=5.1,<6",
    "modal>=1.5.5,<1.6",
    "pydantic>=2.11",
    "pydantic-ai-slim[anthropic,google,logfire,openai]>=2.46,<3",
    "pydantic-settings>=2.6",
    "uvicorn>=0.53,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/sikarescue"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sikarescue"]
known-local-folder = ["helpers"]
